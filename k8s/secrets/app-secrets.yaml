apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: med-erp
  labels:
    app.kubernetes.io/name: med-erp
    app.kubernetes.io/part-of: med-erp
type: Opaque
stringData:
  # Azure Database / MongoDB connection string
  MONGODB_URI: "REPLACE_WITH_MONGODB_CONNECTION_STRING"

  # Use a strong randomly generated JWT secret
  JWT_SECRET: "REPLACE_WITH_STRONG_JWT_SECRET"