apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: med-erp
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: med-erp
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
---
